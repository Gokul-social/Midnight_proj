# =============================================================================
# ZK Expense Splitter — CI Pipeline
# =============================================================================
#
# Runs on every push to main and on pull requests targeting main.
# Jobs:
#   1. backend  — Install deps, compile Compact contract, run 34-test suite
#   2. frontend — Install deps, type-check, production build
#
# Node.js 22.x on ubuntu-latest.
# Fails the pipeline if any test fails, compilation errors, or build breaks.
# =============================================================================

name: CI — Compile, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: Compact contract compilation + Jest test suite
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend — Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      # Note: compactc is not available in CI without the Midnight toolchain
      # installed. The managed/ directory contains pre-compiled output from
      # local compilation. This step validates the stubs are present.
      - name: Verify compiled contract artifacts
        run: |
          echo "🔍 Checking managed/ directory for compiled contract..."
          test -f managed/zk_expense_splitter/contract/index.cjs || exit 1
          test -f managed/zk_expense_splitter/contract/index.d.ts || exit 1
          echo "✅ Compiled contract artifacts present"

      - name: Run backend test suite (34 tests)
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # Frontend: React + Vite + Tailwind CSS build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "🔍 Checking build output..."
          test -f dist/index.html || exit 1
          ls -la dist/assets/
          echo "✅ Frontend build artifacts present"

  # ─────────────────────────────────────────────────────────────
  # Summary gate — both jobs must pass
  # ─────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]] || [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ CI failed — one or more jobs did not pass"
            exit 1
          fi
          echo "✅ All CI checks passed"
